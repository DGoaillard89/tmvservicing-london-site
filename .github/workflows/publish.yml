name: Publish blog
on:
  schedule:
    - cron: "11 6,8,10,12,14,16,18,20,22 * * *"   # UTC: every two hours until late evening, so posts appear close to their time
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: sitemap lastmod for pages comes from each source file's last commit date
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build (publishes any posts that are now due)
        run: python3 _src/build.py
      - name: Commit newly published pages back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Publish scheduled blog posts"; git push; }
      - name: Assemble site (website files only)
        run: |
          mkdir _site
          rsync -a --exclude-from=.deployignore ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      # GitHub sometimes hasn't registered the uploaded artifact yet when deploy asks for it
      # ("No artifacts named github-pages were found"). Wait and try once more before failing.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
